[project]
name = "eaglyssier"
version = "0.1.0"
description = "Eaglyssier: software-project reports — sprints, story points, member analytics, git contribution, deliverables."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "weasyprint>=61.0",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    # Multipart form parsing. NOT optional: FastAPI raises at import time on a
    # route signature containing UploadFile/Form without it, so the whole app
    # fails to boot rather than just the upload endpoint.
    "python-multipart>=0.0.9",
    # PDF text extraction for reference documents. Chosen over pdfminer.six for
    # zero transitive deps and speed — the consumer is an LLM prompt, which
    # tolerates imperfect reading order. No OCR: a scanned PDF yields no text.
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
